<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>사주 계산엔진 테스트</title>
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.3/lunar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/korean-lunar-calendar@0.3.6/dist/korean-lunar-calendar.min.js"></script>
<script src="calc.js"></script>
<style>
body{font-family:-apple-system,sans-serif;padding:16px;font-size:13px;background:#fff;color:#222}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:4px 6px;text-align:left;vertical-align:top}
.ok{color:#137333}.ng{color:#c5221f;font-weight:bold}
</style>
</head>
<body>
<h2>사주 계산엔진 경계 테스트 (규칙서 v2.0)</h2>
<p>정답 세트 대조는 <a href="golden.html">golden.html</a>에서 따로 확인해요.</p>
<p id="sum"></p>
<table><thead><tr><th>#</th><th>테스트</th><th>기대</th><th>결과</th><th></th></tr></thead><tbody id="rows"></tbody></table>
<script>
const run = o => SajuCalc.calculate(Object.assign({ calendar:'solar', gender:0, now:new Date(2026,9,15) }, o));
const T = [], t = (name, expect, fn) => T.push({ name, expect, fn });

/* 시간 보정 */
t('1990-07-01 12:00 → -30분', '1990-07-01 11:30 / 서머타임 0 / 경도 -30', () => { const r = run({y:1990,m:7,d:1,time:'12:00'}).time; return `${r.corrected} / 서머타임 ${-r.dst_correction_min} / 경도 ${r.longitude_correction_min}`; });
t('1987-07-15 10:00 (서머타임) → -60분 -30분', '1987-07-15 08:30 / 서머타임 60 / 경도 -30', () => { const r = run({y:1987,m:7,d:15,time:'10:00'}).time; return `${r.corrected} / 서머타임 ${-r.dst_correction_min} / 경도 ${r.longitude_correction_min}`; });
t('1957-07-01 10:00 (표준시 127°30′ + 서머타임) → -60분만', '1957-07-01 09:00 / 서머타임 60 / 경도 0', () => { const r = run({y:1957,m:7,d:1,time:'10:00'}).time; return `${r.corrected} / 서머타임 ${-r.dst_correction_min} / 경도 ${r.longitude_correction_min}`; });
t('1955-03-01 12:00 (표준시 127°30′) → 보정 없음', '1955-03-01 12:00', () => run({y:1955,m:3,d:1,time:'12:00'}).time.corrected);
t('1987-05-10 02:30 서머타임 시작으로 없는 시각 표시', 'true', () => String(run({y:1987,m:5,d:10,time:'02:30'}).flags.dst_nonexistent_time));

/* 일주 변경 (보정 시각 23:00) */
t('기록 23:29 → 보정 22:59 → 당일 일주, 亥시', '丙戌 / 亥', () => { const r = run({y:1962,m:6,d:17,time:'23:29'}); return `${r.gz.day} / ${r.gz.hour[1]}`; });
t('기록 23:30 → 보정 23:00 → 다음 날 일주, 子시 (샘플7 규칙)', '丁亥 / 庚子', () => { const r = run({y:1962,m:6,d:17,time:'23:30'}); return `${r.gz.day} / ${r.gz.hour}`; });
t('기록 06-18 00:00 → 보정 06-17 23:30 → 丁亥 庚子 (샘플7)', '丁亥 庚子', () => { const r = run({y:1962,m:6,d:18,time:'00:00'}); return `${r.gz.day} ${r.gz.hour}`; });

/* 시진 입력 */
t('子時 입력 → 그날 0시대 (샘플4)', '癸卯 壬子', () => { const r = run({y:1986,m:2,d:28,time:null,sijin:0,gender:1}); return `${r.gz.day} ${r.gz.hour}`; });
t('午時 입력 → 午시', '午', () => run({y:1990,m:7,d:1,time:null,sijin:6}).gz.hour[1]);
t('시간 모름 → 12:00 간주 → 午시', '午 / unknown', () => { const r = run({y:1990,m:7,d:1,time:null}); return `${r.gz.hour[1]} / ${r.flags.time_mode}`; });

/* 한국 음력 */
t('양력 1988-02-19 → 한국 음력 1/2 (중국 음력은 1/3)', '1988-01-02', () => run({y:1988,m:2,d:19,time:'12:00'}).input.lunar_date);
t('한국 음력 1988-01-02 입력 → 양력 1988-02-19', '1988-02-19', () => run({calendar:'lunar',y:1988,m:1,d:2,time:'12:00'}).input.solar_date);
t('없는 윤달 입력은 오류', '오류', () => { try { run({calendar:'leap',y:1990,m:1,d:1,time:'12:00'}); return '통과됨'; } catch (e) { return '오류'; } });

/* 연주·월주 절입 */
t('2024-02-04 17:26 / 17:28 (입춘 17:27 KST)', '癸卯 / 甲辰', () => `${run({y:2024,m:2,d:4,time:'17:26'}).gz.year} / ${run({y:2024,m:2,d:4,time:'17:28'}).gz.year}`);
t('입춘 근처 출생은 절입 경계 알림', 'true', () => String(run({y:2024,m:2,d:4,time:'17:26'}).flags.term_boundary));

/* 무작위 5,000건: 오류 없이 계산되고 5신이 모두 다른 오행인지 */
t('무작위 5,000건 계산 오류 / 5신 중복', '오류 0 / 중복 0', () => {
  let err = 0, dup = 0, seed = 3; const rnd = k => { seed = (seed*9301+49297)%233280; return Math.floor(seed/233280*k); };
  for (let i = 0; i < 5000; i++) {
    try { const r = run({y:1930+rnd(100), m:1+rnd(12), d:1+rnd(28), time: rnd(5) ? `${String(rnd(24)).padStart(2,'0')}:${String(rnd(60)).padStart(2,'0')}` : null, sijin: rnd(2) ? rnd(12) : null, gender:rnd(2)});
      if (new Set(Object.values(r.yong.fiveGods)).size !== 5) dup++; } catch (e) { err++; }
  }
  return `오류 ${err} / 중복 ${dup}`; });

let pass = 0;
document.getElementById('rows').innerHTML = T.map((x, i) => {
  let got; try { got = String(x.fn()); } catch (e) { got = 'ERROR ' + e.message; }
  const ok = got === String(x.expect); if (ok) pass++;
  return `<tr><td>${i+1}</td><td>${x.name}</td><td>${x.expect}</td><td>${got}</td><td class="${ok?'ok':'ng'}">${ok?'통과':'실패'}</td></tr>`;
}).join('');
document.getElementById('sum').textContent = `${pass} / ${T.length} 통과`;
window.TEST_RESULT = { pass, total: T.length };
</script>
</body>
</html>
